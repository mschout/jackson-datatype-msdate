name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git-version derives the project version from tags, so it needs
          # the full history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21 runs Gradle itself, which the convention plugins require; 17
          # supplies the compilation toolchain. The last entry wins JAVA_HOME.
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: >-
          ./gradlew build --stacktrace
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
